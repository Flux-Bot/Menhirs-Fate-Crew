{% extends 'base.html' %}

{% block topbar %}{% endblock %}

{% block header %}
    <title>{% block title %}Camp Plan (Public View){% endblock %}</title>

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
    crossorigin=""/>

    <style>
        /* Ensure the map fills the viewport on mobile */
        #map { height: calc(100vh - 60px); }
        .public-top { padding: 10px; text-align: center; }
        .public-top .btn-row { display: flex; justify-content: center; gap: 0.5rem; flex-wrap: wrap; }
    </style>
{% endblock %}

{% block content %}
    <div class="public-top">
        <h4>{{ map_data[0].project_name if map_data and map_data[0] else 'Camp Plan' }}</h4>
        <div class="btn-row">
            <button id="locBtn" class="btn btn-primary">Show my location</button>
            <button class="btn btn-outline-primary d-lg-none" type="button" data-bs-toggle="offcanvas" data-bs-target="#publicTentSidebarOffcanvas" aria-controls="publicTentSidebarOffcanvas">Open tents</button>
        </div>
        <div id="areasLegend" style="margin-top:8px" class="ms-lg-auto small d-none d-md-flex flex-wrap gap-2"></div>
    </div>

    <div class="offcanvas offcanvas-end d-lg-none" tabindex="-1" id="publicTentSidebarOffcanvas" aria-labelledby="publicTentSidebarOffcanvasLabel">
        <div class="offcanvas-header">
            <h5 class="offcanvas-title" id="publicTentSidebarOffcanvasLabel">Tent list</h5>
            <button type="button" class="btn-close btn-close-white" data-bs-dismiss="offcanvas" aria-label="Close"></button>
        </div>
        <div class="offcanvas-body">
            <div id="publicTentSidebarContent"></div>
        </div>
    </div>

    <div class="container-fluid">
        <div class="row">
            <aside class="public-map-sidebar map-sidebar text-light col-12 col-md-3 col-lg-2 bg-dark border-top border-md-end order-2 order-md-0">
                <div class="p-3">
                    <h5>Tents</h5>
                    <input type="text" id="tentSearch"
                        class="form-control mb-3"
                        placeholder="Search name or Tent ID...">
                    <div id="tentSidebar"></div>
                </div>
            </aside>

            <main class="col-12 col-md-9 col-lg-10 p-0 order-1">
                <script>
                    const projectData = {{ map_data|tojson }};
                    const tentDataFromDb = {{ tent_data|tojson }};
                    window.areasFromDb = {{ areas_data|tojson }};
                    // Mark global flag for map.js to use
                    window.PUBLIC_VIEW = true;
                </script>

                <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
                integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
                crossorigin=""></script>

                <div id="map"></div>

                <script src="static/map.js"></script>

                <script>
                    function syncPublicSidebarForMobile() {
                        const sidebar = document.querySelector('.public-map-sidebar');
                        const offcanvasBody = document.querySelector('#publicTentSidebarOffcanvas .offcanvas-body');

                        if (!sidebar || !offcanvasBody) {
                            return;
                        }

                        if (window.innerWidth < 992) {
                            if (!sidebar._originalParent) {
                                sidebar._originalParent = sidebar.parentNode;
                                sidebar._originalNextSibling = sidebar.nextElementSibling;
                            }

                            if (sidebar.parentNode !== offcanvasBody) {
                                offcanvasBody.appendChild(sidebar);
                                sidebar.classList.add('mobile-offcanvas-sidebar');
                            }

                            return;
                        }

                        if (sidebar._originalParent && sidebar.parentNode === offcanvasBody) {
                            if (sidebar._originalNextSibling) {
                                sidebar._originalParent.insertBefore(sidebar, sidebar._originalNextSibling);
                            } else {
                                sidebar._originalParent.appendChild(sidebar);
                            }
                            sidebar.classList.remove('mobile-offcanvas-sidebar');
                        }
                    }

                    document.addEventListener('DOMContentLoaded', function () {
                        syncPublicSidebarForMobile();
                        window.addEventListener('resize', syncPublicSidebarForMobile);
                    });

                    // Show user location on demand
                    document.getElementById('locBtn').addEventListener('click', function() {
                        if (!navigator.geolocation) {
                            alert('Geolocation is not supported by your browser');
                            return;
                        }

                        navigator.geolocation.getCurrentPosition(function(position) {
                            const lat = position.coords.latitude;
                            const lng = position.coords.longitude;

                            if (window.userLocationMarker) {
                                window.userLocationMarker.setLatLng([lat, lng]);
                            } else {
                                window.userLocationMarker = L.marker([lat, lng], { title: 'Your location' }).addTo(window.map || window._mapReference);
                            }

                            // center map on user
                            if (window.map) {
                                window.map.setView([lat, lng], 18);
                            }
                        }, function(err) {
                            alert('Unable to get your location: ' + err.message);
                        }, { enableHighAccuracy: true });
                    });
                </script>

            </main>
        </div>
    </div>
{% endblock %}
