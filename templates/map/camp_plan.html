{% extends 'base.html' %}

{% block header %}
    <title>{% block title %}Camp Plan{% endblock %}</title>

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
    crossorigin=""/>
{% endblock %}

{% block content %}
    <div class="container-fluid">
        <div class="row">
            <!-- Sidebar -->
            <aside class="map-sidebar col-12 col-md-3 col-lg-2 bg-dark border-top border-md-end order-2 order-md-0">
                <div class="p-3">
                    <h5>Tents</h5>
                    <input type="text" id="tentSearch"
                        class="form-control mb-2"
                        placeholder="Search name or Tent ID...">

                    <div class="form-check mb-2">
                        <input class="form-check-input" type="checkbox" value="" id="filterUnplaced">
                        <label class="form-check-label text-light" for="filterUnplaced">
                            Show Unplaced
                        </label>
                    </div>

                    <div id="tentSidebar"></div>
                </div>
            </aside>

            <!-- Main Content -->
            <main class="col-12 col-md-9 col-lg-10 p-0 order-1">
                <!-- Topbar -->
<div class="Map-Topbar border-bottom bg-white shadow-sm">
    <div class="container-fluid py-2">

        <!-- Row 1 -->
        <form method="POST" id="Add_Tent"
              class="d-flex flex-wrap align-items-center gap-2 mb-2">

            <input
                type="text"
                id="Group_Name"
                class="form-control form-control-sm toolbar-group"
                placeholder="Group Name">

            <select
                id="Area"
                name="Area"
                class="form-select form-select-sm toolbar-area">
                <option value="null" selected>Area</option>
                <option value="Avereaux">Avereaux</option>
                <option value="Wonder">Wonder</option>
                <option value="Valdraeth">Valdraeth</option>
                <option value="Urdrevan">Urdrevan</option>
                <option value="Portavas">Portavas</option>
                <option value="Hammerstadt">Hammerstadt</option>
                <option value="Kairos">Kairos</option>
                <option value="Syradonia">Syradonia</option>
                <option value="Morvalis">Morvalis</option>
                <option value="Crew">Crew</option>
                <option value="Guilds">Guilds</option>
                <option value="Traders">Traders</option>
            </select>

            <input type="number"
                id="Bell_Size"
                class="form-control form-control-sm toolbar-number"
                placeholder="Bell Radius">

            <div class="vr d-none d-md-block"></div>

            <input type="number"
                id="Tent_Length"
                class="form-control form-control-sm toolbar-number"
                placeholder="Length">

            <input type="number"
                id="Tent_Width"
                class="form-control form-control-sm toolbar-number"
                placeholder="Width">

            <div class="d-flex align-items-center gap-2 toolbar-rotation">
                <small class="text-muted">Rot</small>

                <input
                    type="range"
                    id="Tent_Rotation"
                    min="0"
                    max="365"
                    value="0"
                    class="form-range m-0"
                    oninput="this.nextElementSibling.value = this.value">

                <output class="badge bg-secondary">0</output>
            </div>

            <div class="btn-group">
                <input type="button"
                       id="addTentBtn"
                       value="Add"
                       class="btn btn-sm btn-primary">

                <input type="button"
                       id="updateTentBtn"
                       value="Update"
                       class="btn btn-sm btn-warning">

                <input type="button"
                       id="deleteTentBtn"
                       value="Delete"
                       class="btn btn-sm btn-danger">
            </div>

        </form>

        <!-- Row 2 -->
        <div class="d-flex flex-wrap align-items-center gap-2">

            <select
                id="AreaNameForDraw"
                class="form-select form-select-sm toolbar-area">
                <option value="Avereaux">Avereaux</option>
                <option value="Wonder">Wonder</option>
                <option value="Valdraeth">Valdraeth</option>
                <option value="Urdrevan">Urdrevan</option>
                <option value="Portavas">Portavas</option>
                <option value="Hammerstadt">Hammerstadt</option>
                <option value="Kairos">Kairos</option>
                <option value="Syradonia">Syradonia</option>
                <option value="Morvalis">Morvalis</option>
                <option value="Crew">Crew</option>
                <option value="Guilds">Guilds</option>
                <option value="Traders">Traders</option>
            </select>

            <button id="startAreaDraw"
                    class="btn btn-sm btn-outline-primary">
                Start Draw
            </button>

            <button id="finishAreaDraw"
                    class="btn btn-sm btn-success"
                    disabled>
                Finish
            </button>

            <button id="cancelAreaDraw"
                    class="btn btn-sm btn-secondary"
                    disabled>
                Cancel
            </button>

            <button id="deleteSelectedArea"
                    class="btn btn-sm btn-danger"
                    disabled>
                Delete Area
            </button>

            <div id="areasLegend"
                 class="ms-lg-auto small d-none d-md-flex flex-wrap gap-2">
            </div>

        </div>

    </div>
</div>

                
                <!-- Map -->
                <script>
                    const projectData = {{ map_data|tojson }};
                    const tentDataFromDb = {{ tent_data|tojson }};
                    window.areasFromDb = {{ areas_data|tojson }};
                </script>

                <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
                integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
                crossorigin=""></script>

                <div id="map"></div>

                <script src="static/map.js"></script>
                <script src="static/tent_form.js"></script>
            </main>
        </div>
    </div>
{% endblock %}
