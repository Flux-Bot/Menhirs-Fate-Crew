{% extends 'base.html' %}

{% block header %}
    <title>{% block title %}Camp Plan{% endblock %}</title>

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
    crossorigin=""/>
{% endblock %}

{% block content %}
    <div class="container-fluid">
        <div class="row">
            <!-- Sidebar -->
            <aside class="map-sidebar col-12 col-md-3 col-lg-2 bg-light border-top border-md-end order-2 order-md-0">
                <div class="p-3">
                    <h5>Tents</h5>
                    <input type="text" id="tentSearch"
                        class="form-control mb-2"
                        placeholder="Search name or Tent ID...">

                    <div class="form-check mb-2">
                        <input class="form-check-input" type="checkbox" value="" id="filterUnplaced">
                        <label class="form-check-label" for="filterUnplaced">
                            Show Unplaced
                        </label>
                    </div>

                    <div id="tentSidebar"></div>
                </div>
            </aside>

            <!-- Main Content -->
            <main class="col-12 col-md-9 col-lg-10 p-0 order-1">
                <!-- Topbar -->
                <div class="Map-Topbar">
                    <form method="POST" id="Add_Tent">
                        <label for="Group_Name">Group Name</label>
                        <input type="text" id="Group_Name">
                        <label for="Area">Area</label>
                        <select id="Area" name="Area">
                            <option value="null" selected></option>
                            <option value="Avereaux">Avereaux</option>
                            <option value="Wonder">Wonder</option>
                            <option value="Valdraeth">Valdraeth</option>
                            <option value="Urdrevan">Urdrevan</option>
                            <option value="Portavas">Portavas</option>
                            <option value="Hammerstadt">Hammerstadt</option>
                            <option value="Kairos">Kairos</option>
                            <option value="Syradonia">Syradonia</option>
                            <option value="Morvalis">Morvalis</option>
                            <option value="Crew">Crew</option>
                            <option value="Guilds">Guilds</option>
                            <option value="Traders">Traders</option>
                        </select><br>
                        <label for="Bell_Size">Bell Tent Size</label>
                        <input type="number" id="Bell_Size" value="">
                        <label>M</label>
                        <label for="Four_Sided_Tent">Four-sided Tent</label>
                        <input type="number" id="Tent_Length">
                        <label>L</label>
                        <input type="number" id="Tent_Width">
                        <Label>W</Label>
                        <input type="range" id="Tent_Rotation" min="0" max="365" value="0" oninput="this.nextElementSibling.value = this.value">
                        <output>0</output>
                        <label>°</label>
                        <input type="button" id="addTentBtn" value="Add">
                        <input type="button" id="updateTentBtn" value="Update">
                        <input type="button" id="deleteTentBtn" value="Delete">
                    </form>

                    <!-- Area drawing controls -->
                    <div style="display:inline-block; margin-left:16px; vertical-align:top;">
                        <label for="AreaNameForDraw">Draw Area for:</label>
                        <select id="AreaNameForDraw">
                            <option value="Avereaux">Avereaux</option>
                            <option value="Wonder">Wonder</option>
                            <option value="Valdraeth">Valdraeth</option>
                            <option value="Urdrevan">Urdrevan</option>
                            <option value="Portavas">Portavas</option>
                            <option value="Hammerstadt">Hammerstadt</option>
                            <option value="Kairos">Kairos</option>
                            <option value="Syradonia">Syradonia</option>
                            <option value="Morvalis">Morvalis</option>
                            <option value="Crew">Crew</option>
                            <option value="Guilds">Guilds</option>
                            <option value="Traders">Traders</option>
                        </select>
                        <button id="startAreaDraw" class="btn btn-sm btn-outline-primary">Start Area Draw</button>
                        <button id="finishAreaDraw" class="btn btn-sm btn-success" disabled>Finish Area</button>
                        <button id="cancelAreaDraw" class="btn btn-sm btn-secondary" disabled>Cancel</button>
                        <button id="deleteSelectedArea" class="btn btn-sm btn-danger" disabled>Delete Selected Area</button>
                        <div id="areasLegend" style="margin-top:8px"></div>
                    </div>
                </div>
                <!-- Map -->
                <script>
                    const projectData = {{ map_data|tojson }};
                    const tentDataFromDb = {{ tent_data|tojson }};
                    window.areasFromDb = {{ areas_data|tojson }};
                </script>

                <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
                integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
                crossorigin=""></script>

                <div id="map"></div>

                <script src="static/map.js"></script>
                <script src="static/tent_form.js"></script>
            </main>
        </div>
    </div>
{% endblock %}
